[project]
name = "heretic-llm-compat"
version = "1.2.0+compat1"
description = "Fully automatic censorship removal for language models"
readme = "README.md"
license = "AGPL-3.0-or-later"
authors = [
    { name = "Philipp Emanuel Weidmann", email = "pew@worldwidemann.com" }
]
requires-python = ">=3.10"
keywords = ["llm", "transformer", "abliteration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Environment :: GPU",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    # Compat fork pins (for torch 2.5 compatibility; see COMPAT.md):
    # peft 0.19 uses torch.float8_e8m0fnu which doesn't exist on torch < 2.6
    # bitsandbytes 0.49 depends on same missing dtype via its autograd path
    "accelerate>=1.10,<2.0",
    "bitsandbytes>=0.44,<0.47",           # compat: was ~=0.49
    "datasets>=4.0,<5.0",
    "hf-transfer>=0.1,<1.0",
    "huggingface-hub>=0.24,<2.0",
    "immutabledict~=4.3",
    "langdetect~=1.0",
    "lm-eval[hf]>=0.4,<1.0",
    "numpy>=1.26,<3.0",
    "optuna>=4.0,<5.0",
    "peft>=0.16,<0.19",                    # compat: was ~=0.18
    "psutil>=5.9,<10.0",
    "py-cpuinfo~=9.0",
    "pydantic-settings>=2.5,<3.0",
    "questionary>=2.0,<3.0",
    "rich>=13.0,<16.0",
    "tomli-w>=1.0,<2.0",
    "tqdm>=4.60,<5.0",
    "transformers>=4.40,<6.0",             # compat: was ~=5.3
    # kernels is optional on non-CUDA-FA paths; kept loose
    # "kernels~=0.12",   # removed — not strictly required for standard abliteration
]

[project.optional-dependencies]
research = [
    "geom-median~=0.1",
    "imageio~=2.37",
    "matplotlib~=3.10",
    "pacmap~=0.8",
    "scikit-learn~=1.7",
]

[dependency-groups]
dev = [
    "ruff>=0.14.5",
    "ty>=0.0.5",
]

[project.urls]
Homepage = "https://github.com/p-e-w/heretic"
Documentation = "https://github.com/p-e-w/heretic"
Repository = "https://github.com/p-e-w/heretic.git"
Issues = "https://github.com/p-e-w/heretic/issues"
Changelog = "https://github.com/p-e-w/heretic/releases"

[project.scripts]
heretic = "heretic.main:main"

[build-system]
requires = ["uv_build>=0.8.11,<0.9.0"]
build-backend = "uv_build"

[tool.uv]
exclude-newer = "7 days"

[tool.uv.build-backend]
module-name = "heretic"
